<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<title>Post — Autoridade 03</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#111;}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;background:#1B2530;font-family:'Manrope',sans-serif;}
.photo{position:absolute;inset:0;}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center center;display:block;}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,37,48,0.3) 0%,rgba(27,37,48,0.05) 30%,rgba(27,37,48,0.05) 45%,rgba(27,37,48,0.9) 100%);}
.content{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:72px 76px;color:#F5EFEB;}
.top{display:flex;justify-content:space-between;align-items:flex-start;}
.brand{font-size:22px;font-weight:700;}.brand em{opacity:.45;font-style:normal;}
.tag{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:0.28em;border:1.5px solid rgba(200,217,230,0.5);color:#C8D9E6;padding:10px 18px;border-radius:999px;}
.main{display:flex;flex-direction:column;}
.label{font-size:16px;font-weight:700;text-transform:uppercase;letter-spacing:0.3em;color:#C8D9E6;margin-bottom:24px;}
.headline{font-size:80px;font-weight:800;line-height:1.0;letter-spacing:-0.04em;max-width:14ch;}
.headline em{font-style:normal;color:#C8D9E6;}
.sub{margin-top:22px;font-size:26px;font-weight:500;line-height:1.5;max-width:28ch;opacity:.75;}
.cta-row{margin-top:32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;}
.creci{font-size:18px;font-weight:600;line-height:1.7;opacity:.8;}
.handle{font-size:18px;font-weight:700;color:#C8D9E6;}
</style>
</head>
<body>
<div class="slide">
  <div class="photo"><img src="fotos/foto-04.png" alt=""/></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="top">
      <div class="brand">Patrícia e Júlio<em>*</em></div>
      <div class="tag">Seu imóvel</div>
    </div>
    <div class="main">
      <div class="label">Pra você</div>
      <h1 class="headline">O próximo passo<br/>não precisa ser<br/><em>sozinho.</em></h1>
      <p class="sub">Comprar um imóvel é uma das maiores decisões da vida. Ter alguém do lado faz toda a diferença.</p>
      <div class="cta-row">
        <div class="creci">Patrícia Vidal · CRECI 68850<br/>Júlio Aguiar · CRECI 79271</div>
        <div class="handle">@julio_e_patricia_corretores</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
